name: Authenticated staged exam load

on:
  workflow_dispatch:
  push:
    branches:
      - ops/load-1000pm-20260915

permissions:
  contents: read

concurrency:
  group: royal-authenticated-production-load
  cancel-in-progress: false

jobs:
  thousand-per-minute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      TARGET_URL: https://royal-bank-nhr8.vercel.app
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_p3T4sz4VpnWVuhjFgT1kwQ_b3mWaoO9
      LOAD_USER_COUNT: 340
      LOAD_AUTH_PACING_MS: 1600
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare 340 isolated users
        run: node scripts/exam-load-prepare.mjs
      - name: Sustain 17 Create requests per second for 60 seconds
        run: node scripts/exam-load-1000pm.mjs
      - name: Cleanup only this run's isolated users
        if: always()
        run: node scripts/exam-load-cleanup.mjs
      - name: Upload sanitized measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exam-load-1000pm-results
          path: exam-load-1000pm-results.json
          retention-days: 7
