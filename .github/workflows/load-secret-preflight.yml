name: Load Secret Preflight

on:
  push:
    branches:
      - ops/auth-load-20260911
    paths:
      - .github/workflows/load-secret-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    env:
      ROYAL_TEST_TOKEN: ${{ secrets.ROYAL_TEST_TOKEN }}
      ROYAL_LOAD_USERS_JSON: ${{ secrets.ROYAL_LOAD_USERS_JSON }}
      ROYAL_LOAD_PASSWORD: ${{ secrets.ROYAL_LOAD_PASSWORD }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          present() { if [ -n "$2" ]; then echo "$1=present"; else echo "$1=absent"; fi; }
          present ROYAL_TEST_TOKEN "$ROYAL_TEST_TOKEN"
          present ROYAL_LOAD_USERS_JSON "$ROYAL_LOAD_USERS_JSON"
          present ROYAL_LOAD_PASSWORD "$ROYAL_LOAD_PASSWORD"
          present SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"
