name: Smoke Vercel Edge Canary Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/production-canary-smoke-trigger'

permissions:
  contents: read

concurrency:
  group: royal-bank-vercel-edge-canary-production
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_URL: https://trnvsgenmzhyuayxxdoq.supabase.co
      SUPABASE_SECRET_KEY_PRODUCTION: ${{ secrets.SUPABASE_SECRET_KEY_PRODUCTION }}
      APP_URL: https://royal-bank-five.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate canary credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SECRET_KEY_PRODUCTION" || { echo 'SUPABASE_SECRET_KEY_PRODUCTION is missing'; exit 1; }
      - name: Syntax-check canary smoke
        run: node --check scripts/smoke-vercel-edge-canary-production.mjs
      - name: Wait for Production deployment and run isolated canary
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if node scripts/smoke-vercel-edge-canary-production.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo 'Production Vercel Edge canary failed after retries.'
              exit 1
            fi
            echo "Canary attempt $attempt failed; waiting for Production deployment propagation..."
            sleep 15
          done
