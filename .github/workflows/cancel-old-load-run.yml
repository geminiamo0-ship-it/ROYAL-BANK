name: Cancel Superseded Load Run

on:
  push:
    branches:
      - ops/authenticated-load-test
    paths:
      - .github/workflows/cancel-old-load-run.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel superseded single-run load test
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${GITHUB_REPOSITORY}/actions/runs/34668426147/cancel
