name: Generate Core Baseline

on:
  push:
    branches:
      - audit/core-hardening
    paths:
      - '.github/workflows/generate-baseline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local database
        run: supabase db start

      - name: Rebuild current schema
        run: supabase db reset

      - name: Capture current public schema
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline
          supabase db dump --local --schema public --file /tmp/public-before.sql
          cp /tmp/public-before.sql baseline/001_core_baseline.sql

          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          psql "$DB_URL" -Atc "
            SELECT pg_get_triggerdef(t.oid, true) || ';'
            FROM pg_trigger t
            JOIN pg_class c ON c.oid = t.tgrelid
            JOIN pg_namespace n ON n.oid = c.relnamespace
            JOIN pg_proc p ON p.oid = t.tgfoid
            JOIN pg_namespace fn ON fn.oid = p.pronamespace
            WHERE NOT t.tgisinternal
              AND n.nspname <> 'public'
              AND fn.nspname = 'public'
            ORDER BY n.nspname, c.relname, t.tgname;
          " | sed -E 's/EXECUTE FUNCTION ([A-Za-z_][A-Za-z0-9_]*)\(/EXECUTE FUNCTION public.\1(/g' > /tmp/cross-triggers-before.sql

          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec "$DB_CONTAINER" pg_dump \
            --username postgres \
            --dbname postgres \
            --schema=public \
            --schema-only \
            --no-owner \
            --no-comments \
            | grep -E '^(GRANT|REVOKE|ALTER DEFAULT PRIVILEGES)' \
            | LC_ALL=C sort > /tmp/privileges-before.sql

          {
            if [ -s /tmp/cross-triggers-before.sql ]; then
              printf '\n-- Cross-schema triggers owned by ROYAL-BANK public functions.\n'
              cat /tmp/cross-triggers-before.sql
            fi
            if [ -s /tmp/privileges-before.sql ]; then
              printf '\n-- Explicit privileges omitted by supabase db dump.\n'
              cat /tmp/privileges-before.sql
            fi
          } >> baseline/001_core_baseline.sql

          sha256sum baseline/001_core_baseline.sql
          wc -l baseline/001_core_baseline.sql
          wc -l /tmp/privileges-before.sql

      - name: Rebuild using baseline only
        shell: bash
        run: |
          set -euo pipefail
          rm -f supabase/migrations/*.sql
          cp baseline/001_core_baseline.sql supabase/migrations/001_core_baseline.sql
          supabase db reset

      - name: Verify baseline behavior
        run: supabase test db

      - name: Compare reconstructed schema
        shell: bash
        run: |
          set -euo pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          supabase db dump --local --schema public --file /tmp/public-after.sql
          cmp /tmp/public-before.sql /tmp/public-after.sql

          psql "$DB_URL" -Atc "
            SELECT pg_get_triggerdef(t.oid, true) || ';'
            FROM pg_trigger t
            JOIN pg_class c ON c.oid = t.tgrelid
            JOIN pg_namespace n ON n.oid = c.relnamespace
            JOIN pg_proc p ON p.oid = t.tgfoid
            JOIN pg_namespace fn ON fn.oid = p.pronamespace
            WHERE NOT t.tgisinternal
              AND n.nspname <> 'public'
              AND fn.nspname = 'public'
            ORDER BY n.nspname, c.relname, t.tgname;
          " | sed -E 's/EXECUTE FUNCTION ([A-Za-z_][A-Za-z0-9_]*)\(/EXECUTE FUNCTION public.\1(/g' > /tmp/cross-triggers-after.sql
          cmp /tmp/cross-triggers-before.sql /tmp/cross-triggers-after.sql

          DB_CONTAINER="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$DB_CONTAINER"
          docker exec "$DB_CONTAINER" pg_dump \
            --username postgres \
            --dbname postgres \
            --schema=public \
            --schema-only \
            --no-owner \
            --no-comments \
            | grep -E '^(GRANT|REVOKE|ALTER DEFAULT PRIVILEGES)' \
            | LC_ALL=C sort > /tmp/privileges-after.sql
          cmp /tmp/privileges-before.sql /tmp/privileges-after.sql

      - name: Upload validated baseline
        uses: actions/upload-artifact@v4
        with:
          name: core-baseline
          path: baseline/001_core_baseline.sql
          if-no-files-found: error
          retention-days: 3

      - name: Publish validated candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B audit/core-baseline-generated
          git rm .github/workflows/generate-baseline.yml
          git add -A supabase/migrations
          git commit -m 'chore: materialize validated core baseline'
          git push --force origin audit/core-baseline-generated
