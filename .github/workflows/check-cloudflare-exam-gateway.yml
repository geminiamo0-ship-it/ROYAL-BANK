name: Check Cloudflare Exam Gateway

on:
  push:
    branches:
      - architecture/cloudflare-exam-v2
    paths:
      - 'cloudflare/exam-gateway/**'
      - '.github/workflows/check-cloudflare-exam-gateway.yml'
  pull_request:
    paths:
      - 'cloudflare/exam-gateway/**'
      - '.github/workflows/check-cloudflare-exam-gateway.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/exam-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/exam-gateway/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npx wrangler deploy --dry-run
