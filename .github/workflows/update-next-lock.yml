name: Update Next lockfile

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/update-next-lock.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/royal-ai-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Upgrade patched Next.js packages
        run: npm install --save-exact next@16.3.8 eslint-config-next@16.3.8
      - name: Commit generated package files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No package changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: upgrade Next.js security patch"
          git push origin HEAD:feat/royal-ai-v1
