name: Vercel Production Preflight

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/vercel-production-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check required Vercel deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: ${name}"
              missing=1
            else
              echo "Found required secret: ${name}"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Vercel production deployment credentials are available."
