name: Verify Remote Adoption

on:
  push:
    branches:
      - audit/remote-adoption-builder
    paths:
      - '.github/workflows/verify-remote-adoption.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Stage legacy schema through migration 019
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/post019
          for f in $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            base=$(basename "$f")
            num=${base%%_*}
            if [[ "$num" =~ ^[0-9]+$ ]] && (( 10#$num >= 20 )); then
              mv "$f" /tmp/post019/
            fi
          done
      - name: Start local Supabase
        run: supabase db start
      - name: Rebuild older legacy state
        run: supabase db reset
      - name: Build drift-tolerant atomic adoption migration
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'BEGIN;'
            # Critical prerequisites that the real remote is missing or may be missing.
            for n in 020 021 024 025 029 030 031 032; do
              f=$(find /tmp/post019 -maxdepth 1 -type f -name "${n}_*.sql" | head -n1)
              echo "-- BEGIN $(basename "$f")"
              cat "$f"
              echo "-- END $(basename "$f")"
            done
            # Current hardening chain.
            for f in $(find /tmp/post019 -maxdepth 1 -type f -name '*.sql' | sort); do
              base=$(basename "$f")
              num=${base%%_*}
              if [[ "$num" =~ ^[0-9]+$ ]] && (( 10#$num >= 33 )); then
                echo "-- BEGIN $base"
                cat "$f"
                echo "-- END $base"
              fi
            done
            echo 'COMMIT;'
          } > /tmp/remote_adoption.sql
          wc -l /tmp/remote_adoption.sql
      - name: Apply adoption migration as one transaction
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f /tmp/remote_adoption.sql
      - name: Run blocking database behavior tests
        run: supabase test db
