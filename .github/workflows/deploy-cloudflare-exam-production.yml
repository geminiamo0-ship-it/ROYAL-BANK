name: Deploy Cloudflare Exam Production

on:
  workflow_dispatch:
    inputs:
      sync_content:
        description: Rebuild and activate R2 content from Production Supabase
        required: false
        default: false
        type: boolean
      refresh_supabase_secret:
        description: Replace the Worker SUPABASE_SECRET_KEY from the GitHub production secret
        required: false
        default: false
        type: boolean
  push:
    branches:
      - architecture/cloudflare-exam-v2
    paths:
      - '.github/production-bootstrap-trigger'

permissions:
  contents: read

concurrency:
  group: royal-bank-cloudflare-exam-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    defaults:
      run:
        working-directory: cloudflare/exam-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/exam-gateway/package.json

      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Syntax-check Production release builder
        working-directory: .
        run: node --check scripts/sync-edge-production-release.mjs

      - name: Validate production Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Cloudflare account ID is missing'; exit 1; }

      - name: Provision or verify Production R2 bucket
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! npx wrangler r2 bucket info royal-bank-exam-production-content --json >/tmp/royal-prod-r2.json 2>/tmp/royal-prod-r2.err; then
            cat /tmp/royal-prod-r2.err
            npx wrangler r2 bucket create royal-bank-exam-production-content
          fi
          npx wrangler r2 bucket info royal-bank-exam-production-content --json >/tmp/royal-prod-r2.json
          grep -q 'royal-bank-exam-production-content' /tmp/royal-prod-r2.json

      - name: Provision or verify Production Queue
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! npx wrangler queues info royal-bank-exam-production-sync >/tmp/royal-prod-queue.txt 2>/tmp/royal-prod-queue.err; then
            cat /tmp/royal-prod-queue.err
            npx wrangler queues create royal-bank-exam-production-sync
          fi
          npx wrangler queues info royal-bank-exam-production-sync >/tmp/royal-prod-queue.txt
          grep -q 'royal-bank-exam-production-sync' /tmp/royal-prod-queue.txt

      - name: Provision or verify Production DLQ
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! npx wrangler queues info royal-bank-exam-production-sync-dlq >/tmp/royal-prod-dlq.txt 2>/tmp/royal-prod-dlq.err; then
            cat /tmp/royal-prod-dlq.err
            npx wrangler queues create royal-bank-exam-production-sync-dlq
          fi
          npx wrangler queues info royal-bank-exam-production-sync-dlq >/tmp/royal-prod-dlq.txt
          grep -q 'royal-bank-exam-production-sync-dlq' /tmp/royal-prod-dlq.txt

      - name: Build and activate Production R2 release
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.sync_content == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[sync-content]')) }}
        working-directory: .
        env:
          SUPABASE_URL: https://trnvsgenmzhyuayxxdoq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY_PRODUCTION }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          EXPECTED_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: royal-bank-exam-production-content
        run: node scripts/sync-edge-production-release.mjs

      - name: Configure Production Supabase secret
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_supabase_secret == true }}
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY_PRODUCTION: ${{ secrets.SUPABASE_SECRET_KEY_PRODUCTION }}
        run: printf '%s' "$SUPABASE_SECRET_KEY_PRODUCTION" | npx wrangler secret put SUPABASE_SECRET_KEY --env production

      - name: Deploy Production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: npx wrangler deploy --env production

      - name: Verify Production health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            https://royal-bank-exam-production.geminiamo0.workers.dev/health | tee /tmp/royal-exam-production-health.json
          grep -q '"ok":true' /tmp/royal-exam-production-health.json
          grep -q '"environment":"production"' /tmp/royal-exam-production-health.json
          grep -q '"supabase_project_ref":"trnvsgenmzhyuayxxdoq"' /tmp/royal-exam-production-health.json

      - name: Verify Production content pointer through Worker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://royal-bank-exam-production.geminiamo0.workers.dev/health >/tmp/royal-exam-production-health-final.json
          grep -q '"ok":true' /tmp/royal-exam-production-health-final.json
