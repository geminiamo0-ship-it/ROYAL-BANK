name: Cleanup Authenticated Load Test Leftovers

on:
  push:
    branches:
      - ops/authenticated-load-test
    paths:
      - .github/workflows/authenticated-load-cleanup-current.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Cleanup stale isolated load runs
        shell: bash
        run: |
          for tag in 34655983644 34655992460; do
            echo "Cleaning isolated load run ${tag}"
            LOAD_RUN_TAG_TO_CLEAN="${tag}" node scripts/auth-load-cleanup-run-tag.mjs
          done
