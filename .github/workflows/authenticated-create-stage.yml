name: Authenticated Create Stage

on:
  push:
    branches:
      - ops/authenticated-load-test
    paths:
      - .github/workflows/authenticated-create-stage.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: royal-authenticated-create-stage
  cancel-in-progress: false

env:
  TARGET_URL: https://royal-bank-nhr8.vercel.app
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_p3T4sz4VpnWVuhjFgT1kwQ_b3mWaoO9
  STAGE_USERS: 150
  LOAD_USER_COUNT: 150
  LOAD_AUTH_PACING_MS: 1200
  LOAD_SHARD: stage
  STAGE_LABEL: post-079-create-budget-150

jobs:
  create_stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare isolated authenticated users
        run: node scripts/auth-load-prepare-1000.mjs
      - name: Run synchronized Create stage
        run: node scripts/auth-create-stage.mjs
      - name: Upload stage result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: royal-create-stage-${{ env.STAGE_USERS }}
          path: royal-create-stage-${{ env.STAGE_USERS }}.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Cleanup isolated load users
        if: always()
        run: node scripts/auth-load-cleanup-1000.mjs
