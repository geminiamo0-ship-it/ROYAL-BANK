name: Royal bounded production diagnostic 20260914
on:
  push:
    branches: [ops/diagnostic-20260914]
    paths: [.github/workflows/royal-diagnostic-20260914.yml]
permissions:
  contents: read
concurrency:
  group: royal-authenticated-production-load
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      TARGET_URL: https://royal-bank-nhr8.vercel.app
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_p3T4sz4VpnWVuhjFgT1kwQ_b3mWaoO9
      LOAD_USER_COUNT: 26
      LOAD_AUTH_PACING_MS: 1600
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3b5cb2c92893ce7e81fd7c5f2247cbe1471129c4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Write diagnostic tooling
        shell: bash
        run: |
          cat > scripts/diagnostic-prepare.mjs <<'PREPARE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { createClient } from '@supabase/supabase-js';
          import { createServerClient } from '@supabase/ssr';
          
          const url = process.env.SUPABASE_URL;
          const serviceKey = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const publishableKey = process.env.SUPABASE_PUBLISHABLE_KEY;
          if (!url || !serviceKey || !publishableKey) throw new Error('Missing Supabase load-test configuration.');
          
          const requestedCount = Number(process.env.LOAD_USER_COUNT || 25);
          const userCount = Math.max(1, Math.min(Number.isFinite(requestedCount) ? Math.floor(requestedCount) : 25, 100));
          const requestedPacingMs = Number(process.env.LOAD_AUTH_PACING_MS || 1200);
          const authPacingMs = Math.max(0, Math.min(Number.isFinite(requestedPacingMs) ? Math.floor(requestedPacingMs) : 1200, 10000));
          const admin = createClient(url, serviceKey, { auth: { autoRefreshToken: false, persistSession: false } });
          const password = `RoyalLoad!${crypto.randomBytes(24).toString('base64url')}`;
          const expiresAt = new Date(Date.now() + 2 * 60 * 60 * 1000).toISOString();
          const runTag = String(process.env.GITHUB_RUN_ID || Date.now()).replace(/\D/g, '').slice(-12) || String(Date.now());
          const rows = [];
          const ids = [];
          
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          
          async function signInWithRateLimitRetry(client, email) {
            let lastError = null;
            for (let attempt = 0; attempt < 8; attempt += 1) {
              const signedIn = await client.auth.signInWithPassword({ email, password });
              if (!signedIn.error) return;
              lastError = signedIn.error;
              const rateLimited = signedIn.error.status === 429 || signedIn.error.code === 'over_request_rate_limit';
              if (!rateLimited) throw signedIn.error;
              const waitMs = Math.min(60000, 5000 * (2 ** attempt));
              console.log(`Auth preparation rate-limited for ${email}; retrying in ${waitMs}ms.`);
              await sleep(waitMs);
            }
            throw lastError || new Error(`Could not authenticate ${email}`);
          }
          
          for (let i = 1; i <= userCount; i += 1) {
            const email = `royal-load-${runTag}-${String(i).padStart(3, '0')}@load.invalid`;
            const created = await admin.auth.admin.createUser({
              email,
              password,
              email_confirm: true,
              user_metadata: { full_name: `Royal Load ${i}` },
            });
            if (created.error || !created.data.user) throw created.error || new Error(`Could not create ${email}`);
            const user = created.data.user;
            ids.push(user.id);
            fs.writeFileSync('load-user-ids.json', JSON.stringify(ids));
          
            const profile = await admin.from('profiles').update({ is_active: true, role: 'student' }).eq('id', user.id);
            if (profile.error) throw profile.error;
            const grant = await admin.from('user_access_grants').insert({
              user_id: user.id,
              scope_type: 'bank',
              question_bank_id: 1,
              starts_at: new Date().toISOString(),
              expires_at: expiresAt,
            });
            if (grant.error) throw grant.error;
          
            const jar = new Map();
            const client = createServerClient(url, publishableKey, {
              cookieOptions: { name: 'royal-auth', path: '/', sameSite: 'lax', secure: true, httpOnly: true },
              cookies: {
                getAll: () => [...jar.entries()].map(([name, value]) => ({ name, value })),
                setAll: (cookies) => cookies.forEach((cookie) => jar.set(cookie.name, cookie.value)),
              },
              auth: { autoRefreshToken: false, persistSession: true, detectSessionInUrl: false },
            });
            await signInWithRateLimitRetry(client, email);
            const cookie = [...jar.entries()].map(([name, value]) => `${name}=${value}`).join('; ');
            if (!cookie.includes('royal-auth')) throw new Error(`Auth cookie missing for ${email}`);
            rows.push({ email, cookie });
            fs.writeFileSync('load-cookies.json', JSON.stringify(rows));
            if (authPacingMs > 0 && i < userCount) await sleep(authPacingMs);
          }
          
          console.log(`Prepared ${rows.length} isolated authenticated users for run ${runTag}.`);
          
          PREPARE
          cat > scripts/diagnostic-cleanup.mjs <<'CLEANUP'
          import fs from 'node:fs';
          import { createClient } from '@supabase/supabase-js';
          
          const url = process.env.SUPABASE_URL;
          const serviceKey = process.env.SUPABASE_SERVICE_ROLE_KEY;
          if (!url || !serviceKey) throw new Error('Missing Supabase cleanup configuration.');
          
          const admin = createClient(url, serviceKey, { auth: { autoRefreshToken: false, persistSession: false } });
          let ids = [];
          try {
            ids = JSON.parse(fs.readFileSync('load-user-ids.json', 'utf8'));
          } catch {}
          ids = Array.isArray(ids) ? [...new Set(ids.filter(Boolean))] : [];
          
          if (ids.length) {
            const sessions = await admin.from('test_sessions').delete().in('user_id', ids);
            if (sessions.error) throw sessions.error;
          
            const grants = await admin.from('user_access_grants').delete().in('user_id', ids);
            if (grants.error) throw grants.error;
          }
          
          let removed = 0;
          for (const id of ids) {
            const deleted = await admin.auth.admin.deleteUser(id, false);
            if (deleted.error && deleted.error.status !== 404 && deleted.error.code !== 'user_not_found') throw deleted.error;
            if (!deleted.error) removed += 1;
          }
          console.log(`Removed ${removed}/${ids.length} isolated load users after clearing exam data.`);
          
          CLEANUP
          cat > scripts/diagnostic-run.mjs <<'PROBE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const users=JSON.parse(fs.readFileSync('load-cookies.json','utf8'));
          const target=process.env.TARGET_URL;
          const report={target,at:new Date().toISOString(),source_commit:'3b5cb2c92893ce7e81fd7c5f2247cbe1471129c4',rows:[]};
          function save(){fs.writeFileSync('royal-diagnostic-results.json',JSON.stringify(report,null,2));}
          async function req(user,action,args,token){
           const start=performance.now(); let row={action};
           try{
           const headers={'content-type':'application/json',cookie:user.cookie,'user-agent':'RoyalBank-Authorized-Diagnostic/20260914'};
           if(token)headers['x-royal-window-access']=token;
           const r=await fetch(target+'/api/exam',{method:'POST',redirect:'manual',headers,body:JSON.stringify({action,args}),signal:AbortSignal.timeout(25000)});
           const body=await r.text(); let json;try{json=JSON.parse(body);}catch{}
           row={action,status:r.status,ms:+(performance.now()-start).toFixed(1),timing:r.headers.get('server-timing'),request_id:r.headers.get('x-royal-request-id'),error:json?.error?.code||null,valid_session:!!json?.session?.id,bootstrap_timing:json?.timing||json?.timings||null};
           report.rows.push(row);save();console.log('DIAGNOSTIC '+JSON.stringify(row));
           return {status:r.status,json,row};
           }catch(e){row={action,status:0,ms:+(performance.now()-start).toFixed(1),error:e.name};report.rows.push(row);save();console.log('DIAGNOSTIC '+JSON.stringify(row));return{status:0};}
          }
          const createArgs=()=>({p_request_id:crypto.randomUUID(),p_bank_id:1,p_session_type:'standard',p_limit:40,p_difficulties:[],p_categories:[],p_topics:[],p_question_selection:'all'});
          async function journey(u){
           const c=await req(u,'create',createArgs());
           if(c.status!==200||!c.json?.session?.id||!c.json?.window_access_token)throw Error('Create preflight failed; stopping before further load');
           const sid=c.json.session.id,token=c.json.window_access_token;
           const w=await req(u,'window',{p_session_id:sid,p_start:0,p_count:3},token);
           if(w.status!==200||!Array.isArray(w.json)||!w.json[0]?.options?.[0])throw Error('Window failed');
           const q=w.json[0];
           const a=await req(u,'submit',{p_request_id:crypto.randomUUID(),p_session_id:sid,p_question_id:q.id,p_selected_option_id:q.options[0].id,p_time_spent_seconds:15});
           if(a.status!==200)throw Error('Answer failed');
           const b=await req(u,'bootstrap',{p_session_id:sid});
           if(b.status!==200)throw Error('Resume failed');
           if(!b.json?.answers?.some(x=>Number(x.question_id)===Number(q.id)&&Number(x.selected_option_id)===Number(q.options[0].id)))throw Error('Saved answer missing after resume');
           report.answer_persistence_verified=true;
           const complete=await req(u,'complete',{p_session_id:sid});if(complete.status!==200)throw Error('Complete failed');
           const review=await req(u,'reviewBootstrap',{p_session_id:sid});if(review.status!==200)throw Error('Review failed');
           if(!review.json?.answers?.some(x=>Number(x.question_id)===Number(q.id)&&Number(x.selected_option_id)===Number(q.options[0].id)))throw Error('Saved answer missing in completed review');
           report.review_persistence_verified=true;
          }
          try{
           await journey(users[0]);
           await new Promise(r=>setTimeout(r,3000));
           const rows=await Promise.all(users.slice(1).map(u=>req(u,'create',createArgs())));
           if(rows.some(r=>r.status!==200||!r.json?.session?.id))throw Error('Concurrent create failed');
           report.passed=true;
          }catch(e){report.passed=false;report.stop_reason=e.message;process.exitCode=1;}
          finally{save();console.log('DIAGNOSTIC_SUMMARY '+JSON.stringify(report));}
          
          PROBE
      - name: Confirm production project and prepare 26 isolated users
        shell: bash
        run: |
          node -e "if(new URL(process.env.SUPABASE_URL).hostname !== 'trnvsgenmzhyuayxxdoq.supabase.co')throw Error('Unexpected Supabase project')"
          node scripts/diagnostic-prepare.mjs
      - name: Test journey then 25 concurrent creates
        run: node scripts/diagnostic-run.mjs
      - name: Cleanup isolated test users
        if: always()
        run: node scripts/diagnostic-cleanup.mjs
      - name: Upload sanitized measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: royal-diagnostic-20260914
          path: royal-diagnostic-results.json
          retention-days: 7
