name: Prepare Migration Squash

on:
  push:
    branches:
      - audit/core-hardening-clean
    paths:
      - '.github/workflows/prepare-migration-squash.yml'

concurrency:
  group: prepare-migration-squash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  squash:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local database
        run: supabase db start

      - name: Verify original migrations first
        run: |
          supabase db reset
          supabase test db

      - name: Squash schema migrations
        run: supabase migration squash --local

      - name: Verify squashed migrations from scratch
        run: |
          supabase db reset
          supabase test db

      - name: List squashed migration files
        if: always()
        run: find supabase/migrations -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Upload squashed migration directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: squashed-migrations
          path: supabase/migrations
          if-no-files-found: error
          retention-days: 3
