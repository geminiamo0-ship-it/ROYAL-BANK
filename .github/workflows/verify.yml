name: Verify

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'supabase/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/verify-db.yml'
  pull_request:
    paths-ignore:
      - 'supabase/**'
      - 'docs/**'
      - '*.md'
      - '.github/workflows/verify-db.yml'

concurrency:
  group: verify-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      ROYAL_APP_URL: https://royal.example
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee verify.log

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log
          path: verify.log
          if-no-files-found: warn
          retention-days: 3
