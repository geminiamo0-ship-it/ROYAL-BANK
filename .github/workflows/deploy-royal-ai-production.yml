name: Deploy Royal AI Production

on:
  workflow_dispatch:
  push:
    branches:
      - feat/royal-ai-v1
      - main
    paths:
      - '.github/workflows/deploy-royal-ai-production.yml'
      - 'cloudflare/royal-ai-gateway/**'
      - 'scripts/publish-royal-ai-corpus.mjs'
      - 'supabase/migrations/20261001193000_royal_ai_v1.sql'

permissions:
  contents: read

concurrency:
  group: royal-bank-royal-ai-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    defaults:
      run:
        working-directory: cloudflare/royal-ai-gateway

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/royal-ai-gateway/package.json

      - name: Install Royal AI Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck Royal AI Worker
        run: npm run typecheck

      - name: Validate Production credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY_PRODUCTION: ${{ secrets.SUPABASE_SECRET_KEY_PRODUCTION }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Cloudflare account ID is missing'; exit 1; }
          test -n "$SUPABASE_SECRET_KEY_PRODUCTION" || { echo 'SUPABASE_SECRET_KEY_PRODUCTION is missing'; exit 1; }
          test -n "$R2_ACCOUNT_ID" || { echo 'R2_ACCOUNT_ID is missing'; exit 1; }
          test -n "$R2_ACCESS_KEY_ID" || { echo 'R2_ACCESS_KEY_ID is missing'; exit 1; }
          test -n "$R2_SECRET_ACCESS_KEY" || { echo 'R2_SECRET_ACCESS_KEY is missing'; exit 1; }
          test -n "$OPENROUTER_API_KEY" || { echo 'OPENROUTER_API_KEY is missing'; exit 1; }
          test "$R2_ACCOUNT_ID" = "$CLOUDFLARE_ACCOUNT_ID" || { echo 'R2 account does not match Cloudflare account'; exit 1; }

      - name: Provision or verify isolated Royal AI R2 bucket
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! npx wrangler r2 bucket info royal-ai-production-corpus --json >/tmp/royal-ai-r2.json 2>/tmp/royal-ai-r2.err; then
            cat /tmp/royal-ai-r2.err
            npx wrangler r2 bucket create royal-ai-production-corpus
          fi
          npx wrangler r2 bucket info royal-ai-production-corpus --json >/tmp/royal-ai-r2.json
          grep -q 'royal-ai-production-corpus' /tmp/royal-ai-r2.json

      - name: Provision or verify Royal AI Queue
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! npx wrangler queues info royal-ai-sync-production >/tmp/royal-ai-queue.txt 2>/tmp/royal-ai-queue.err; then
            cat /tmp/royal-ai-queue.err
            npx wrangler queues create royal-ai-sync-production
          fi
          npx wrangler queues info royal-ai-sync-production >/tmp/royal-ai-queue.txt
          grep -q 'royal-ai-sync-production' /tmp/royal-ai-queue.txt

      - name: Provision or verify Royal AI DLQ
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! npx wrangler queues info royal-ai-sync-production-dlq >/tmp/royal-ai-dlq.txt 2>/tmp/royal-ai-dlq.err; then
            cat /tmp/royal-ai-dlq.err
            npx wrangler queues create royal-ai-sync-production-dlq
          fi
          npx wrangler queues info royal-ai-sync-production-dlq >/tmp/royal-ai-dlq.txt
          grep -q 'royal-ai-sync-production-dlq' /tmp/royal-ai-dlq.txt

      - name: Publish Royal medical corpus to Production R2
        working-directory: .
        env:
          SUPABASE_URL: https://trnvsgenmzhyuayxxdoq.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY_PRODUCTION }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: royal-ai-production-corpus
          ROYAL_AI_CORPUS_ROOT: royal-ai-corpus
          ROYAL_AI_CORPUS_CONCURRENCY: '16'
        run: node scripts/publish-royal-ai-corpus.mjs

      - name: Provision or verify Royal AI Search v2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if ! npx wrangler ai-search get royal-medical-knowledge-production --json >/tmp/royal-ai-search.json 2>/tmp/royal-ai-search.err; then
            cat /tmp/royal-ai-search.err
            npx wrangler ai-search create royal-medical-knowledge-production \
              --type r2 \
              --source royal-ai-production-corpus \
              --chunk-size 576 \
              --chunk-overlap 10 \
              --max-num-results 10 \
              --hybrid-search true \
              --json >/tmp/royal-ai-search.json
          fi

          npx wrangler ai-search get royal-medical-knowledge-production --json | tee /tmp/royal-ai-search.json
          test "$(jq -r '.source' /tmp/royal-ai-search.json)" = "royal-ai-production-corpus"

          # Ask AI Search to notice newly published/updated corpus objects immediately.
          npx wrangler ai-search jobs create royal-medical-knowledge-production \
            --description "Royal AI production corpus sync" \
            --json >/tmp/royal-ai-job.json || true
          cat /tmp/royal-ai-job.json 2>/dev/null || true

      - name: Check Royal AI semantic search
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler ai-search stats royal-medical-knowledge-production --json | tee /tmp/stats.json
          npx wrangler ai-search search royal-medical-knowledge-production \
            --query "hypertension treatment" --json >/tmp/search.json || true

          VECTORS="$(jq -r '.engine.vectorize.vectorsCount // 0' /tmp/stats.json)"
          ERRORS="$(jq -r '.error // 0' /tmp/stats.json)"
          CHUNKS="$(jq -r '.chunks | length // 0' /tmp/search.json 2>/dev/null || echo 0)"

          echo "semantic_smoke vectors=$VECTORS chunks=$CHUNKS indexing_errors=$ERRORS"
          if [ "$VECTORS" -le 0 ]; then
            echo "::warning::Royal AI Search has not finished vector indexing yet; deploying Worker while Cloudflare continues indexing."
          fi
          if [ "$ERRORS" -gt 0 ]; then
            echo "::warning::Royal AI Search reports $ERRORS isolated indexing errors; deployment will continue."
          fi

      - name: Configure Production Supabase secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          SUPABASE_SECRET_KEY_PRODUCTION: ${{ secrets.SUPABASE_SECRET_KEY_PRODUCTION }}
        run: printf '%s' "$SUPABASE_SECRET_KEY_PRODUCTION" | npx wrangler secret put SUPABASE_SECRET_KEY --env production

      - name: Configure Production OpenRouter secret
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: printf '%s' "$OPENROUTER_API_KEY" | npx wrangler secret put OPENROUTER_API_KEY --env production

      - name: Deploy Royal AI Production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: npx wrangler deploy --env production

      - name: Verify Royal AI Production health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-delay 3 \
            https://royal-ai-production.geminiamo0.workers.dev/health \
            | tee /tmp/royal-ai-health.json
          grep -q '"ok":true' /tmp/royal-ai-health.json
          grep -q '"environment":"production"' /tmp/royal-ai-health.json
          grep -q '"aiSearchInstance":"royal-medical-knowledge-production"' /tmp/royal-ai-health.json
          grep -q '"openRouterConfigured":true' /tmp/royal-ai-health.json
