name: Deploy Cloudflare Exam DEV

on:
  push:
    branches:
      - architecture/cloudflare-exam-v2
      - feat/deep-dive-ai-v1
    paths:
      - 'cloudflare/exam-gateway/**'
      - '.github/workflows/deploy-cloudflare-exam-dev.yml'
  workflow_dispatch:

concurrency:
  group: royal-bank-cloudflare-exam-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/exam-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/exam-gateway/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          test -n "$OPENROUTER_API_KEY" || { echo 'OPENROUTER_API_KEY is missing'; exit 1; }
      - name: Configure DEV OpenRouter secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: printf '%s' "$OPENROUTER_API_KEY" | npx wrangler secret put OPENROUTER_API_KEY
      - name: Verify DEV OpenRouter model
        shell: bash
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "HTTP-Referer: https://royal-bank-five.vercel.app" \
            -H "X-Title: Royal Bank Deep Dive DEV Smoke" \
            -d '{"model":"deepseek/deepseek-v4.1-flash","temperature":0,"max_tokens":64,"messages":[{"role":"user","content":"Reply only: OK"}]}' \
            >/tmp/openrouter-smoke.json
          node -e "const r=require('/tmp/openrouter-smoke.json'); if (!r?.choices?.[0]?.message?.content) { console.error(JSON.stringify(r)); process.exit(1); } console.log('OpenRouter model smoke: OK')"

      - name: Deploy DEV Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Verify DEV health
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://royal-bank-v2-exam.geminiamo0.workers.dev/health | tee /tmp/royal-exam-health.json
          grep -q '"ok":true' /tmp/royal-exam-health.json
          grep -q '"environment":"development"' /tmp/royal-exam-health.json
          grep -q '"supabase_project_ref":"dcttiqdrsvkufzjahjzw"' /tmp/royal-exam-health.json
          grep -q '"deep_dive":{"configured":true' /tmp/royal-exam-health.json
