name: Authenticated Production Load Test V3

on:
  push:
    branches:
      - ops/authenticated-load-test
    paths:
      - .github/workflows/authenticated-load-test-v3.yml

permissions:
  contents: read

env:
  TARGET_URL: https://royal-bank-21be.vercel.app
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_p3T4sz4VpnWVuhjFgT1kwQ_b3mWaoO9

jobs:
  authenticated-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Prepare isolated authenticated users
        run: node scripts/auth-load-prepare.mjs
      - name: Authenticated preflight
        run: |
          node --input-type=module - <<'EOF'
          import fs from 'node:fs';
          const [first] = JSON.parse(fs.readFileSync('load-cookies.json', 'utf8'));
          const target = process.env.TARGET_URL.replace(/\/$/, '');
          const res = await fetch(`${target}/bank/1`, {
            headers: { cookie: first.cookie, 'user-agent': 'RoyalBank-Authorized-LoadTest/2.0' },
            redirect: 'manual',
          });
          console.log(`Authenticated /bank/1 preflight status: ${res.status}`);
          if (res.status !== 200) process.exit(1);
          EOF
      - name: Phase A - 10 concurrent students
        env:
          LOAD_VUS: 10
        run: |
          docker run --rm -e TARGET_URL="$TARGET_URL" -e LOAD_VUS="$LOAD_VUS" \
            -v "$PWD:/work:ro" -w /work/scripts grafana/k6:0.52.0 run /work/scripts/auth-load-k6.js
      - name: Cooldown
        run: sleep 20
      - name: Phase B - 25 concurrent students
        env:
          LOAD_VUS: 25
        run: |
          docker run --rm -e TARGET_URL="$TARGET_URL" -e LOAD_VUS="$LOAD_VUS" \
            -v "$PWD:/work:ro" -w /work/scripts grafana/k6:0.52.0 run /work/scripts/auth-load-k6.js
      - name: Cleanup isolated load users
        if: always()
        run: node scripts/auth-load-cleanup.mjs
