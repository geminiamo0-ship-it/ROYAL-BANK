name: Sync R2 Exam Content

on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify existing R2 objects without uploading
        required: true
        default: false
        type: boolean
  push:
    branches:
      - ops/r2-resync-20260913
    paths:
      - '.github/workflows/sync-r2-exam-content.yml'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      ROYAL_R2_CONTENT_PREFIX: exam-content/v1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync and verify private R2 exam content
        if: ${{ !inputs.verify_only }}
        run: node scripts/sync-exam-content-to-r2.mjs

      - name: Verify private R2 exam content
        if: ${{ inputs.verify_only }}
        run: node scripts/sync-exam-content-to-r2.mjs --verify-only
