name: Repair Royal AI Index

on:
  push:
    branches:
      - fix/royal-ai-search-readiness
    paths:
      - '.github/workflows/repair-royal-ai-index.yml'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Fix path filter and start fresh indexing job
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai-search/namespaces/default/instances/royal-medical-knowledge"

          curl --fail --silent --show-error "$BASE"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json" > /tmp/current.json

          jq '{source_params: (.result.source_params + {include_items:["royal-ai-corpus/**"], exclude_items:[]})}'             /tmp/current.json > /tmp/update.json

          curl --fail --silent --show-error -X PUT "$BASE"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data @/tmp/update.json | tee /tmp/updated.json

          test "$(jq -r '.success' /tmp/updated.json)" = "true"
          test "$(jq -r '.result.source_params.include_items[0]' /tmp/updated.json)" = "royal-ai-corpus/**"

          curl --fail --silent --show-error -X POST "$BASE/jobs"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data '{"description":"Royal AI corrected path-filter reindex"}'             | tee /tmp/job.json

          test "$(jq -r '.success' /tmp/job.json)" = "true"
          echo "JOB_ID=$(jq -r '.result.id' /tmp/job.json)"
