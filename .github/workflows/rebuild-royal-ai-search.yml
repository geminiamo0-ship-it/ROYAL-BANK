name: Rebuild Royal AI Search Cleanly

on:
  push:
    branches:
      - fix/royal-ai-search-readiness
    paths:
      - '.github/workflows/rebuild-royal-ai-search.yml'

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    defaults:
      run:
        working-directory: cloudflare/royal-ai-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/royal-ai-gateway/package.json

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Delete polluted AI Search instance
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai-search/namespaces/default/instances/royal-medical-knowledge"

          STATUS="$(curl --silent --show-error -o /tmp/delete.json -w '%{http_code}' -X DELETE "$BASE"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json")"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            cat /tmp/delete.json
          elif [ "$STATUS" = "404" ]; then
            echo "Instance already absent."
          else
            cat /tmp/delete.json
            exit 1
          fi

          for i in $(seq 1 20); do
            CODE="$(curl --silent --show-error -o /tmp/get.json -w '%{http_code}' "$BASE"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json")"
            if [ "$CODE" = "404" ]; then
              exit 0
            fi
            sleep 3
          done
          echo "Instance did not disappear in time."
          exit 1

      - name: Create clean Royal-only AI Search instance
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler ai-search create royal-medical-knowledge             --type r2             --source royal-bank-exam-production-content             --prefix royal-ai-corpus/             --chunk-size 576             --chunk-overlap 10             --max-num-results 10             --hybrid-search true             --json | tee /tmp/create.json

          npx wrangler ai-search get royal-medical-knowledge --json | tee /tmp/get.json
          test "$(jq -r '.source_params.prefix // empty' /tmp/get.json)" = "royal-ai-corpus/"

      - name: Wait for real indexed vectors and search hits
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            npx wrangler ai-search stats royal-medical-knowledge --json >/tmp/stats.json
            QUEUED="$(jq -r '.queued // 0' /tmp/stats.json)"
            COMPLETED="$(jq -r '.completed // 0' /tmp/stats.json)"
            ERRORS="$(jq -r '.error // 0' /tmp/stats.json)"
            VECTORS="$(jq -r '.engine.vectorize.vectorsCount // 0' /tmp/stats.json)"
            echo "attempt=$attempt queued=$QUEUED completed=$COMPLETED errors=$ERRORS vectors=$VECTORS"

            if [ "$VECTORS" -gt 0 ] && [ "$COMPLETED" -gt 0 ]; then
              npx wrangler ai-search search royal-medical-knowledge                 --query "hypertension" --json >/tmp/search.json
              CHUNKS="$(jq -r '.chunks | length' /tmp/search.json)"
              if [ "$CHUNKS" -gt 0 ]; then
                cat /tmp/stats.json
                cat /tmp/search.json
                exit 0
              fi
            fi
            sleep 10
          done

          echo "AI Search failed to become ready."
          cat /tmp/stats.json
          exit 1
