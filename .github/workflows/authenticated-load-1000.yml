name: Authenticated Production 1000 User Burst

on:
  push:
    branches:
      - ops/authenticated-load-test
    paths:
      - .github/workflows/authenticated-load-1000.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: royal-authenticated-1000-burst
  cancel-in-progress: false

env:
  TARGET_URL: https://royal-bank-nhr8.vercel.app
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_p3T4sz4VpnWVuhjFgT1kwQ_b3mWaoO9
  LOAD_USER_COUNT: 1000
  LOAD_AUTH_PACING_MS: 1200

jobs:
  burst:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare 1000 isolated authenticated users
        run: node scripts/auth-load-prepare-1000.mjs

      - name: Run 1000-user 1000-request create burst
        shell: bash
        run: |
          cat > /tmp/royal-1000-burst.mjs <<'EOF'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { performance } from 'node:perf_hooks';

          const target = (process.env.TARGET_URL || '').replace(/\/$/, '');
          const users = JSON.parse(fs.readFileSync('load-cookies.json', 'utf8'));
          if (!Array.isArray(users) || users.length !== 1000) {
            throw new Error(`Expected exactly 1000 prepared users, got ${Array.isArray(users) ? users.length : 'invalid'}.`);
          }

          function percentile(values, q) {
            if (!values.length) return null;
            const xs = [...values].sort((a, b) => a - b);
            const i = Math.min(xs.length - 1, Math.max(0, Math.ceil(xs.length * q) - 1));
            return Number(xs[i].toFixed(2));
          }

          async function createExam(account, index, zero) {
            const launchedAt = performance.now();
            try {
              const res = await fetch(`${target}/api/exam`, {
                method: 'POST',
                headers: {
                  'content-type': 'application/json',
                  cookie: account.cookie,
                  'user-agent': 'RoyalBank-Authorized-LoadTest/1000-burst',
                },
                body: JSON.stringify({
                  action: 'create',
                  args: {
                    p_request_id: crypto.randomUUID(),
                    p_bank_id: 1,
                    p_session_type: 'timed',
                    p_limit: 40,
                    p_difficulties: [],
                    p_categories: [],
                    p_topics: [],
                    p_question_selection: 'all',
                  },
                }),
                redirect: 'manual',
                signal: AbortSignal.timeout(60000),
              });
              await res.arrayBuffer();
              const endedAt = performance.now();
              return {
                index,
                status: res.status,
                duration_ms: endedAt - launchedAt,
                launch_offset_ms: launchedAt - zero,
              };
            } catch (error) {
              const endedAt = performance.now();
              return {
                index,
                status: 0,
                duration_ms: endedAt - launchedAt,
                launch_offset_ms: launchedAt - zero,
                error: String(error?.message || error).slice(0, 160),
              };
            }
          }

          console.log('BURST_START users=1000 requests=1000 action=create questions=40');
          const zero = performance.now();
          const rows = await Promise.all(users.map((account, index) => createExam(account, index + 1, zero)));
          const finished = performance.now();

          const durations = rows.map((r) => r.duration_ms);
          const statuses = {};
          for (const row of rows) statuses[row.status] = (statuses[row.status] || 0) + 1;
          const ok = rows.filter((r) => r.status >= 200 && r.status < 300).length;
          const errors429 = rows.filter((r) => r.status === 429).length;
          const errors5xx = rows.filter((r) => r.status >= 500 && r.status <= 599).length;
          const networkErrors = rows.filter((r) => r.status === 0).length;
          const wallMs = finished - zero;
          const summary = {
            target,
            users: 1000,
            requests: rows.length,
            action: 'create',
            questions_per_session: 40,
            success: ok,
            success_rate: Number((ok / rows.length).toFixed(4)),
            statuses,
            errors_429: errors429,
            errors_5xx: errors5xx,
            network_errors: networkErrors,
            p50_ms: percentile(durations, 0.50),
            p95_ms: percentile(durations, 0.95),
            p99_ms: percentile(durations, 0.99),
            max_ms: Number(Math.max(...durations).toFixed(2)),
            launch_skew_ms: Number(Math.max(...rows.map((r) => r.launch_offset_ms)).toFixed(2)),
            wall_ms: Number(wallMs.toFixed(2)),
            achieved_rps: Number((rows.length / (wallMs / 1000)).toFixed(2)),
          };

          fs.writeFileSync('royal-load-1000-results.json', JSON.stringify({ summary, rows }, null, 2));
          console.log(`ROYAL_LOAD_1000_SUMMARY ${JSON.stringify(summary)}`);
          EOF
          node /tmp/royal-1000-burst.mjs

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [ -f royal-load-1000-results.json ]; then
            echo '## Royal authenticated 1000-user burst' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.summary | "- Target: " + .target,
              "- Users / requests: " + (.users|tostring) + " / " + (.requests|tostring),
              "- Success: " + (.success|tostring) + " (" + ((.success_rate * 100)|tostring) + "%)",
              "- Statuses: " + (.statuses|tojson),
              "- 429: " + (.errors_429|tostring),
              "- 5xx: " + (.errors_5xx|tostring),
              "- Network errors: " + (.network_errors|tostring),
              "- p50: " + (.p50_ms|tostring) + " ms",
              "- p95: " + (.p95_ms|tostring) + " ms",
              "- p99: " + (.p99_ms|tostring) + " ms",
              "- Max: " + (.max_ms|tostring) + " ms",
              "- Achieved RPS: " + (.achieved_rps|tostring),
              "- Launch skew: " + (.launch_skew_ms|tostring) + " ms"' royal-load-1000-results.json >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: royal-authenticated-load-1000
          path: royal-load-1000-results.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Cleanup isolated load users
        if: always()
        run: node scripts/auth-load-cleanup-1000.mjs
