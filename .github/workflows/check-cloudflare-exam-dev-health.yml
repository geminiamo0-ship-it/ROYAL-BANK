name: Check Cloudflare Exam DEV Health

on:
  push:
    branches:
      - architecture/cloudflare-exam-v2
    paths:
      - '.github/workflows/check-cloudflare-exam-dev-health.yml'
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check canonical DEV Worker health
        shell: bash
        run: |
          sleep 5
          body="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 https://royal-bank-v2-exam.geminiamo0.workers.dev/health)"
          echo "$body"
          printf '%s' "$body" | grep -q '"ok":true'
          printf '%s' "$body" | grep -q '"service":"royal-bank-exam-dev"'
          printf '%s' "$body" | grep -q '"environment":"development"'
          printf '%s' "$body" | grep -q '"supabase_project_ref":"dcttiqdrsvkufzjahjzw"'
