name: Authenticated Production Load Test

on:
  workflow_dispatch:
  push:
    branches:
      - ops/auth-load-20260911
    paths:
      - ops/auth-load-run-trigger.txt

permissions:
  contents: read

concurrency:
  group: royal-authenticated-production-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      TARGET_URL: https://royal-bank-21be.vercel.app
      SUPABASE_URL: https://trnvsgenmzhyuayxxdoq.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_p3T4sz4VpnWVuhjFgT1kwQ_b3mWaoO9
      EXPECTED_RELEASE_ID: 8ff494831d8e000213876bef397532f997ce15ca3749228de9bb2edc1a28a956
      ROYAL_LOAD_USERS_JSON: ${{ secrets.ROYAL_LOAD_USERS_JSON }}

    steps:
      - name: Validate isolated load-user bundle
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ROYAL_LOAD_USERS_JSON" ]; then
            echo 'ROYAL_LOAD_USERS_JSON is not configured in the production GitHub Environment.' >&2
            exit 2
          fi
          node - <<'NODE'
          const rows = JSON.parse(process.env.ROYAL_LOAD_USERS_JSON || '[]');
          if (!Array.isArray(rows) || rows.length < 10) throw new Error('Expected at least 10 isolated load users.');
          const usable = rows.filter((r) => r && (r.refresh_token || r.refreshToken || r.access_token || r.accessToken || r.token));
          if (usable.length !== rows.length) throw new Error('Every load user must contain a refresh_token or access_token.');
          console.log(`Load bundle ready: ${rows.length} isolated users.`);
          NODE

      - name: Run authenticated end-to-end load scenario
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/royal-auth-load.mjs <<'NODE'
          import { randomUUID } from 'node:crypto';
          import fs from 'node:fs/promises';

          const TARGET = process.env.TARGET_URL.replace(/\/$/, '');
          const SUPABASE_URL = process.env.SUPABASE_URL.replace(/\/$/, '');
          const KEY = process.env.SUPABASE_PUBLISHABLE_KEY;
          const EXPECTED_RELEASE = process.env.EXPECTED_RELEASE_ID;
          const rawUsers = JSON.parse(process.env.ROYAL_LOAD_USERS_JSON || '[]').slice(0, 25);
          const STAGES = [10, 20, 30, 40, 50];
          const STAGE_SECONDS = 8;
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const pctl = (xs, p) => xs.length ? xs[Math.min(xs.length - 1, Math.max(0, Math.ceil(xs.length * p / 100) - 1))] : null;

          function summarize(label, results) {
            const lat = results.map((r) => r.ms).filter(Number.isFinite).sort((a,b) => a-b);
            const statuses = {};
            for (const r of results) statuses[String(r.status || 'network')] = (statuses[String(r.status || 'network')] || 0) + 1;
            const pick = (p) => { const v = pctl(lat, p); return v == null ? null : +v.toFixed(1); };
            const out = {
              label,
              requests: results.length,
              status_counts: statuses,
              p50_ms: pick(50), p95_ms: pick(95), p99_ms: pick(99),
              max_ms: lat.length ? +lat.at(-1).toFixed(1) : null,
              network_or_5xx: results.filter((r) => r.status === 0 || r.status >= 500).length,
              rate_limited_429: results.filter((r) => r.status === 429).length,
            };
            console.log(JSON.stringify(out, null, 2));
            return out;
          }

          async function request(url, options = {}) {
            const started = performance.now();
            try {
              const res = await fetch(url, { ...options, signal: AbortSignal.timeout(12000) });
              const text = await res.text();
              let json = null;
              try { json = text ? JSON.parse(text) : null; } catch {}
              return { status: res.status, ms: performance.now() - started, text, json };
            } catch (error) {
              return { status: 0, ms: performance.now() - started, text: String(error?.message || error), json: null };
            }
          }

          async function resolveToken(row, index) {
            const refresh = row.refresh_token || row.refreshToken || '';
            if (refresh) {
              const res = await request(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
                method: 'POST', headers: { apikey: KEY, 'content-type': 'application/json' },
                body: JSON.stringify({ refresh_token: refresh }),
              });
              if (res.status !== 200 || !res.json?.access_token) throw new Error(`Load user ${index + 1} refresh failed: HTTP ${res.status}`);
              return { index, token: res.json.access_token, authMs: res.ms };
            }
            const token = row.access_token || row.accessToken || row.token || '';
            if (!token) throw new Error(`Load user ${index + 1} has no usable token.`);
            return { index, token, authMs: 0 };
          }

          async function gateway(user, action, args, windowToken = null) {
            const headers = { authorization: `Bearer ${user.token}`, 'content-type': 'application/json' };
            if (windowToken) headers['x-royal-window-access'] = windowToken;
            return request(`${TARGET}/api/exam`, { method: 'POST', headers, body: JSON.stringify({ action, args }) });
          }

          async function createSession(user) {
            const res = await gateway(user, 'create', {
              p_request_id: randomUUID(), p_bank_id: 1, p_session_type: 'standard', p_limit: 40,
              p_difficulties: [], p_categories: [], p_topics: [], p_question_selection: 'all',
            });
            const sessionId = res.json?.session?.id;
            const windowToken = res.json?.window_access_token;
            if (res.status !== 200 || !sessionId || !windowToken) throw new Error(`Create failed for load user ${user.index + 1}: HTTP ${res.status} ${res.text.slice(0,160)}`);
            return { ...user, sessionId, windowToken, totalQuestions: Number(res.json?.session?.total_questions || 0), releaseId: res.json?.session?.content_release_id || null, createMs: res.ms };
          }

          async function windowHit(user, start = 0, keepBody = false) {
            const res = await gateway(user, 'window', { p_session_id: user.sessionId, p_start: start, p_count: 3 }, user.windowToken);
            return keepBody ? res : { status: res.status, ms: res.ms, text: res.status === 200 ? '' : res.text.slice(0,160) };
          }

          async function runStage(users, targetRps) {
            const started = performance.now(), endAt = started + STAGE_SECONDS * 1000, interval = 1000 / targetRps;
            const busy = new Set(), pending = new Set(), results = [];
            let cursor = 0, nextAt = started, offered = 0, skipped = 0, seq = 0;
            const launch = (u) => {
              busy.add(u.index);
              const span = Math.max(1, u.totalQuestions - 3), start = (seq++ * 3) % span;
              const p = windowHit(u, start).then((r) => results.push(r)).finally(() => busy.delete(u.index));
              pending.add(p); p.finally(() => pending.delete(p));
            };
            while (performance.now() < endAt) {
              const now = performance.now();
              if (now < nextAt) { await sleep(Math.min(2, nextAt - now)); continue; }
              while (nextAt <= now && nextAt < endAt) {
                offered++; let chosen = null;
                for (let i = 0; i < users.length; i++) { const u = users[(cursor + i) % users.length]; if (!busy.has(u.index)) { chosen = u; cursor = (cursor + i + 1) % users.length; break; } }
                if (chosen) launch(chosen); else skipped++;
                nextAt += interval;
              }
              await sleep(0);
            }
            await Promise.allSettled([...pending]);
            const out = summarize(`window_${targetRps}rps`, results);
            out.offered = offered; out.sent = results.length; out.scheduler_skips = skipped;
            out.dispatch_rps = +(results.length / STAGE_SECONDS).toFixed(2);
            out.backpressure_rate = offered ? +(skipped / offered).toFixed(4) : 0;
            return out;
          }

          const report = { target: TARGET, generated_at: new Date().toISOString(), virtual_users: rawUsers.length, phases: [] };
          console.log(`Resolving ${rawUsers.length} isolated user sessions...`);
          const users = await Promise.all(rawUsers.map(resolveToken));
          report.phases.push(summarize('auth_refresh', users.map((u) => ({ status: 200, ms: u.authMs }))));

          console.log('Creating concurrent 40-question Standard sessions...');
          const sessions = await Promise.all(users.map(createSession));
          const create = summarize('create_40q', sessions.map((u) => ({ status: 200, ms: u.createMs })));
          create.release_ids = [...new Set(sessions.map((u) => u.releaseId))];
          report.phases.push(create);
          if (!create.release_ids.every((id) => id === EXPECTED_RELEASE)) throw new Error(`Unexpected release: ${JSON.stringify(create.release_ids)}`);

          const warm = await Promise.all(sessions.map((u) => windowHit(u, 0)));
          report.phases.push(summarize('window_warmup', warm));
          if (warm.some((r) => r.status !== 200)) throw new Error('Window warmup returned a non-200 response.');

          for (const rps of STAGES) {
            const stage = await runStage(sessions, rps); report.phases.push(stage);
            const errorRate = stage.requests ? stage.network_or_5xx / stage.requests : 1;
            if (errorRate >= 0.02 || stage.rate_limited_429 > 0 || (stage.p95_ms ?? 0) > 3000 || stage.backpressure_rate >= 0.15) { stage.stop = true; break; }
            await sleep(4000);
          }

          console.log('Cooling 65s before write path...');
          await sleep(65000);
          const targets = await Promise.all(sessions.map(async (u) => {
            const res = await windowHit(u, 0, true);
            if (res.status !== 200 || !Array.isArray(res.json) || res.json.length < 2) throw new Error(`Cannot prepare answer target for user ${u.index + 1}.`);
            return res.json.slice(0,2).map((q) => ({ questionId: Number(q.id), optionId: Number(q.options?.[0]?.id) }));
          }));

          async function submit(u, t) {
            const res = await gateway(u, 'submit', { p_request_id: randomUUID(), p_session_id: u.sessionId, p_question_id: t.questionId, p_selected_option_id: t.optionId, p_time_spent_seconds: 15 });
            return { status: res.status, ms: res.ms, text: res.status === 200 ? '' : res.text.slice(0,160) };
          }

          const wave1 = await Promise.all(sessions.map((u,i) => submit(u, targets[i][0])));
          report.phases.push(summarize('submit_wave_1', wave1));
          if (wave1.some((r) => r.status !== 200)) throw new Error('Submit wave 1 returned non-200 responses.');
          await sleep(3000);
          const wave2 = await Promise.all(sessions.map((u,i) => submit(u, targets[i][1])));
          report.phases.push(summarize('submit_wave_2', wave2));
          if (wave2.some((r) => r.status !== 200)) throw new Error('Submit wave 2 returned non-200 responses.');

          await sleep(3000);
          const complete = await Promise.all(sessions.map(async (u) => {
            const res = await gateway(u, 'complete', { p_session_id: u.sessionId });
            return { status: res.status, ms: res.ms, text: res.status === 200 ? '' : res.text.slice(0,160) };
          }));
          report.phases.push(summarize('complete', complete));
          if (complete.some((r) => r.status !== 200)) throw new Error('Complete returned non-200 responses.');

          await sleep(3000);
          const review = await Promise.all(sessions.map(async (u) => {
            const res = await gateway(u, 'reviewBootstrap', { p_session_id: u.sessionId });
            return { status: res.status, ms: res.ms, text: res.status === 200 ? '' : res.text.slice(0,160) };
          }));
          report.phases.push(summarize('review_bootstrap', review));
          if (review.some((r) => r.status !== 200)) throw new Error('Review bootstrap returned non-200 responses.');

          await fs.writeFile('authenticated-load-results.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          NODE
          node /tmp/royal-auth-load.mjs

      - name: Upload aggregate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-production-load-results
          path: authenticated-load-results.json
          if-no-files-found: ignore
          retention-days: 3
