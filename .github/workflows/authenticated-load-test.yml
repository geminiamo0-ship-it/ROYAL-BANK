name: Authenticated Production Load Ramp

on:
  push:
    branches:
      - ops/authenticated-load-test
    paths:
      - .github/workflows/authenticated-load-test.yml

permissions:
  contents: read

concurrency:
  group: royal-authenticated-production-ramp
  cancel-in-progress: false

env:
  TARGET_URL: https://royal-bank-21be.vercel.app
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_p3T4sz4VpnWVuhjFgT1kwQ_b3mWaoO9
  LOAD_USER_COUNT: 50
  LOAD_AUTH_PACING_MS: 1200

jobs:
  ramp:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Prepare 50 isolated authenticated users
        run: node scripts/auth-load-prepare.mjs
      - name: Run authenticated 10-50 ramp
        shell: bash
        run: |
          cat > /tmp/auth-ramp.mjs <<'EOF'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { performance } from 'node:perf_hooks';

          const target = (process.env.TARGET_URL || '').replace(/\/$/, '');
          const allUsers = JSON.parse(fs.readFileSync('load-cookies.json', 'utf8'));
          const phases = [10, 20, 30, 40, 50];
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

          function pct(values, q) {
            if (!values.length) return null;
            const xs = [...values].sort((a,b) => a-b);
            const i = Math.min(xs.length - 1, Math.max(0, Math.ceil(xs.length * q) - 1));
            return Number(xs[i].toFixed(2));
          }

          function stats(rows, key) {
            const xs = rows.map((r) => r.timings?.[key]).filter(Number.isFinite);
            return { count: xs.length, p50_ms: pct(xs, .50), p95_ms: pct(xs, .95), max_ms: xs.length ? Number(Math.max(...xs).toFixed(2)) : null };
          }

          async function timedFetch(url, init) {
            const start = performance.now();
            try {
              const res = await fetch(url, { ...init, signal: AbortSignal.timeout(15000) });
              const text = await res.text();
              let json = null; try { json = text ? JSON.parse(text) : null; } catch {}
              return { status: res.status, ms: performance.now() - start, text, json };
            } catch (e) {
              return { status: 0, ms: performance.now() - start, text: String(e?.message || e), json: null };
            }
          }

          function gateway(account, action, args, token) {
            const headers = { 'content-type': 'application/json', cookie: account.cookie, 'user-agent': 'RoyalBank-Authorized-LoadTest/4.0' };
            if (token) headers['x-royal-window-access'] = token;
            return timedFetch(`${target}/api/exam`, { method: 'POST', headers, body: JSON.stringify({ action, args }), redirect: 'manual' });
          }

          async function bankBurst(users) {
            const rows = await Promise.all(users.map(async (u) => {
              const out = await timedFetch(`${target}/bank/1`, { headers: { cookie: u.cookie, 'user-agent': 'RoyalBank-Authorized-LoadTest/4.0' }, redirect: 'manual' });
              return { status: out.status, ms: out.ms };
            }));
            const xs = rows.map((r) => r.ms);
            const buckets = {}; for (const r of rows) buckets[r.status] = (buckets[r.status] || 0) + 1;
            return { total: rows.length, ok200: rows.filter((r) => r.status === 200).length, statuses: buckets, p50_ms: pct(xs,.5), p95_ms: pct(xs,.95), max_ms: Number(Math.max(...xs).toFixed(2)) };
          }

          async function coreFlow(account) {
            const r = { ok: false, failedStep: null, statuses: {}, timings: {} };
            const create = await gateway(account, 'create', {
              p_request_id: crypto.randomUUID(), p_bank_id: 1, p_session_type: 'standard', p_limit: 10,
              p_difficulties: [], p_categories: [], p_topics: [], p_question_selection: 'all',
            });
            r.statuses.create = create.status; r.timings.create = create.ms;
            const session = create.json?.session; const token = create.json?.window_access_token;
            if (create.status !== 200 || !session?.id || !token) { r.failedStep='create'; r.detail=create.text.slice(0,120); return r; }

            const w0 = await gateway(account, 'window', { p_session_id: session.id, p_start: 0, p_count: 3 }, token);
            r.statuses.window0 = w0.status; r.timings.window0 = w0.ms;
            if (w0.status !== 200 || !Array.isArray(w0.json) || !w0.json.length) { r.failedStep='window0'; r.detail=w0.text.slice(0,120); return r; }

            const w3 = await gateway(account, 'window', { p_session_id: session.id, p_start: 3, p_count: 3 }, token);
            r.statuses.window3 = w3.status; r.timings.window3 = w3.ms;
            if (w3.status !== 200) { r.failedStep='window3'; r.detail=w3.text.slice(0,120); return r; }

            const q = w0.json[0], option = q?.options?.[0];
            if (!q?.id || !option?.id) { r.failedStep='question-shape'; return r; }
            const submit = await gateway(account, 'submit', {
              p_request_id: crypto.randomUUID(), p_session_id: session.id, p_question_id: Number(q.id),
              p_selected_option_id: Number(option.id), p_time_spent_seconds: 8,
            });
            r.statuses.submit = submit.status; r.timings.submit = submit.ms;
            if (submit.status !== 200 || Number(submit.json?.answer?.question_id) !== Number(q.id)) { r.failedStep='submit'; r.detail=submit.text.slice(0,120); return r; }

            const complete = await gateway(account, 'complete', { p_session_id: session.id });
            r.statuses.complete = complete.status; r.timings.complete = complete.ms;
            if (complete.status !== 200) { r.failedStep='complete'; r.detail=complete.text.slice(0,120); return r; }
            r.ok = true; return r;
          }

          for (const n of phases) {
            const users = allUsers.slice(0,n);
            const bank = await bankBurst(users);
            console.log(`RAMP_BANK_${n} ${JSON.stringify(bank)}`);
            await sleep(5000);

            const rows = await Promise.all(users.map(coreFlow));
            const failures = {}; const statusByFailure = {};
            for (const r of rows.filter((x) => !x.ok)) {
              failures[r.failedStep || 'unknown'] = (failures[r.failedStep || 'unknown'] || 0) + 1;
              const st = r.statuses?.[r.failedStep] ?? 0;
              const k = `${r.failedStep || 'unknown'}:${st}`; statusByFailure[k] = (statusByFailure[k] || 0) + 1;
            }
            const summary = {
              users: n, ok: rows.filter((r) => r.ok).length, success_rate: Number((rows.filter((r) => r.ok).length / n).toFixed(4)),
              failures, failure_statuses: statusByFailure,
              create: stats(rows,'create'), window0: stats(rows,'window0'), window3: stats(rows,'window3'), submit: stats(rows,'submit'), complete: stats(rows,'complete'),
            };
            console.log(`RAMP_CORE_${n} ${JSON.stringify(summary)}`);
            await sleep(20000);
          }
          EOF
          node /tmp/auth-ramp.mjs
      - name: Cleanup isolated load users
        if: always()
        run: node scripts/auth-load-cleanup.mjs
