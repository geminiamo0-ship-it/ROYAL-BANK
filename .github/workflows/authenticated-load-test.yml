name: Authenticated Production Load Test

on:
  push:
    branches:
      - ops/authenticated-load-test
    paths:
      - .github/workflows/authenticated-load-test.yml

permissions:
  contents: read

env:
  TARGET_URL: https://royal-bank-21be.vercel.app
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_p3T4sz4VpnWVuhjFgT1kwQ_b3mWaoO9

jobs:
  authenticated-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare isolated authenticated users
        run: |
          cat > /tmp/prepare-load-users.mjs <<'EOF'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { createClient } from '@supabase/supabase-js';
          import { createServerClient } from '@supabase/ssr';

          const url = process.env.SUPABASE_URL;
          const serviceKey = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const publishableKey = process.env.SUPABASE_PUBLISHABLE_KEY;
          if (!url || !serviceKey || !publishableKey) throw new Error('Required Supabase configuration is missing.');

          const admin = createClient(url, serviceKey, {
            auth: { autoRefreshToken: false, persistSession: false },
          });
          const password = `RoyalLoad!${crypto.randomBytes(24).toString('base64url')}`;
          const expiresAt = new Date(Date.now() + 2 * 60 * 60 * 1000).toISOString();

          const { data: listed, error: listError } = await admin.auth.admin.listUsers({ page: 1, perPage: 1000 });
          if (listError) throw listError;
          const byEmail = new Map((listed.users || []).map((u) => [u.email, u]));
          const rows = [];
          const ids = [];

          for (let i = 1; i <= 25; i += 1) {
            const email = `royal-load-${String(i).padStart(3, '0')}@load.invalid`;
            let user = byEmail.get(email);
            if (!user) {
              const created = await admin.auth.admin.createUser({
                email,
                password,
                email_confirm: true,
                user_metadata: { full_name: `Royal Load ${i}` },
              });
              if (created.error || !created.data.user) throw created.error || new Error(`Could not create ${email}`);
              user = created.data.user;
            } else {
              const updated = await admin.auth.admin.updateUserById(user.id, {
                password,
                email_confirm: true,
                user_metadata: { ...(user.user_metadata || {}), full_name: `Royal Load ${i}` },
              });
              if (updated.error) throw updated.error;
            }

            ids.push(user.id);
            const profileUpdate = await admin.from('profiles').update({ is_active: true, role: 'student' }).eq('id', user.id);
            if (profileUpdate.error) throw profileUpdate.error;

            const existingGrant = await admin
              .from('user_access_grants')
              .select('id')
              .eq('user_id', user.id)
              .eq('scope_type', 'bank')
              .eq('question_bank_id', 1)
              .is('revoked_at', null)
              .limit(1);
            if (existingGrant.error) throw existingGrant.error;
            if (!existingGrant.data?.length) {
              const grant = await admin.from('user_access_grants').insert({
                user_id: user.id,
                scope_type: 'bank',
                question_bank_id: 1,
                starts_at: new Date().toISOString(),
                expires_at: expiresAt,
              });
              if (grant.error) throw grant.error;
            }

            const jar = new Map();
            const sessionClient = createServerClient(url, publishableKey, {
              cookieOptions: {
                name: 'royal-auth',
                path: '/',
                sameSite: 'lax',
                secure: true,
                httpOnly: true,
              },
              cookies: {
                getAll() {
                  return [...jar.entries()].map(([name, value]) => ({ name, value }));
                },
                setAll(cookies) {
                  for (const cookie of cookies) jar.set(cookie.name, cookie.value);
                },
              },
              auth: { autoRefreshToken: false, persistSession: true, detectSessionInUrl: false },
            });
            const signedIn = await sessionClient.auth.signInWithPassword({ email, password });
            if (signedIn.error) throw signedIn.error;
            const cookie = [...jar.entries()].map(([name, value]) => `${name}=${value}`).join('; ');
            if (!cookie.includes('royal-auth')) throw new Error(`Auth cookie missing for ${email}`);
            rows.push({ email, cookie });
          }

          fs.writeFileSync('load-cookies.json', JSON.stringify(rows));
          fs.writeFileSync('load-user-ids.json', JSON.stringify(ids));
          console.log(`Prepared ${rows.length} isolated authenticated users.`);
          EOF
          node /tmp/prepare-load-users.mjs

      - name: Authenticated preflight
        run: |
          cat > /tmp/preflight.mjs <<'EOF'
          import fs from 'node:fs';
          const [first] = JSON.parse(fs.readFileSync('load-cookies.json', 'utf8'));
          const target = process.env.TARGET_URL.replace(/\/$/, '');
          const res = await fetch(`${target}/bank/1`, {
            headers: { cookie: first.cookie, 'user-agent': 'RoyalBank-Authorized-LoadTest/2.0' },
            redirect: 'manual',
          });
          console.log(`Authenticated /bank/1 preflight status: ${res.status}`);
          if (res.status !== 200) {
            console.log(`Redirect location: ${res.headers.get('location') || '-'}`);
            process.exit(1);
          }
          EOF
          node /tmp/preflight.mjs

      - name: Write real exam scenario
        run: |
          cat > load-auth.js <<'EOF'
          import http from 'k6/http';
          import { check } from 'k6';
          import { Rate, Trend } from 'k6/metrics';

          const users = JSON.parse(open('./load-cookies.json'));
          const target = (__ENV.TARGET_URL || '').replace(/\/$/, '');
          const vus = Math.max(1, Math.min(Number(__ENV.LOAD_VUS || 10), users.length));

          const flowErrors = new Rate('flow_errors');
          const server5xx = new Rate('server_5xx');
          const rateLimited = new Rate('rate_limited');
          const bankMs = new Trend('bank_ms', true);
          const createMs = new Trend('create_ms', true);
          const windowMs = new Trend('window_ms', true);
          const submitMs = new Trend('submit_ms', true);
          const completeMs = new Trend('complete_ms', true);

          export const options = {
            scenarios: {
              students: { executor: 'per-vu-iterations', vus, iterations: 1, maxDuration: '90s' },
            },
            thresholds: {
              flow_errors: ['rate<0.02'],
              server_5xx: ['rate<0.01'],
              rate_limited: ['rate<0.02'],
              bank_ms: ['p(95)<2000'],
              create_ms: ['p(95)<5000'],
              window_ms: ['p(95)<2500'],
              submit_ms: ['p(95)<4000'],
              complete_ms: ['p(95)<5000'],
            },
            userAgent: 'RoyalBank-Authorized-LoadTest/2.0',
          };

          function uuid() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
              const r = Math.floor(Math.random() * 16);
              return (c === 'x' ? r : ((r & 0x3) | 0x8)).toString(16);
            });
          }

          function record(res, trend) {
            trend.add(res.timings.duration);
            server5xx.add(res.status === 0 || res.status >= 500);
            rateLimited.add(res.status === 429);
          }

          function gateway(cookie, action, args, token) {
            const headers = { 'content-type': 'application/json', cookie };
            if (token) headers['x-royal-window-access'] = token;
            return http.post(`${target}/api/exam`, JSON.stringify({ action, args }), {
              headers,
              redirects: 0,
              tags: { action },
            });
          }

          function markFailure(label, res) {
            flowErrors.add(true, { step: label });
            console.error(`${label}: status=${res?.status || 0} body=${String(res?.body || '').slice(0, 240)}`);
          }

          export default function () {
            const account = users[(__VU - 1) % users.length];
            const cookie = account.cookie;

            const bank = http.get(`${target}/bank/1`, { headers: { cookie }, redirects: 0, tags: { action: 'bank' } });
            record(bank, bankMs);
            if (!check(bank, { 'bank authenticated': (r) => r.status === 200 })) return markFailure('bank', bank);

            const create = gateway(cookie, 'create', {
              p_request_id: uuid(), p_bank_id: 1, p_session_type: 'standard', p_limit: 10,
              p_difficulties: [], p_categories: [], p_topics: [], p_question_selection: 'all',
            });
            record(create, createMs);
            let bootstrap = null;
            try { bootstrap = create.json(); } catch {}
            if (!check(create, {
              'create 200': (r) => r.status === 200,
              'session created': () => Boolean(bootstrap?.session?.id),
              'release pinned': () => /^[0-9a-f]{64}$/.test(String(bootstrap?.session?.content_release_id || '')),
              'window token issued': () => Boolean(bootstrap?.window_access_token),
            })) return markFailure('create', create);

            const sessionId = bootstrap.session.id;
            const token = bootstrap.window_access_token;
            const w0 = gateway(cookie, 'window', { p_session_id: sessionId, p_start: 0, p_count: 3 }, token);
            record(w0, windowMs);
            let questions = null;
            try { questions = w0.json(); } catch {}
            if (!check(w0, {
              'window0 200': (r) => r.status === 200,
              'window0 hydrated': () => Array.isArray(questions) && questions.length > 0,
            })) return markFailure('window0', w0);

            const w3 = gateway(cookie, 'window', { p_session_id: sessionId, p_start: 3, p_count: 3 }, token);
            record(w3, windowMs);
            if (!check(w3, { 'window3 200': (r) => r.status === 200 })) return markFailure('window3', w3);

            const q = questions[0];
            const option = q?.options?.[0];
            if (!q?.id || !option?.id) {
              flowErrors.add(true, { step: 'question-shape' });
              return;
            }

            const submit = gateway(cookie, 'submit', {
              p_request_id: uuid(), p_session_id: sessionId, p_question_id: Number(q.id),
              p_selected_option_id: Number(option.id), p_time_spent_seconds: 8,
            });
            record(submit, submitMs);
            let submitted = null;
            try { submitted = submit.json(); } catch {}
            if (!check(submit, {
              'submit 200': (r) => r.status === 200,
              'answer persisted': () => Number(submitted?.answer?.question_id) === Number(q.id),
              'feedback hydrated': () => Boolean(submitted?.feedback),
            })) return markFailure('submit', submit);

            const complete = gateway(cookie, 'complete', { p_session_id: sessionId });
            record(complete, completeMs);
            if (!check(complete, { 'complete 200': (r) => r.status === 200 })) return markFailure('complete', complete);

            flowErrors.add(false);
          }

          export function handleSummary(data) {
            const value = (name, key) => data.metrics[name]?.values?.[key] ?? null;
            console.log(`ROYAL_AUTH_LOAD_SUMMARY ${JSON.stringify({
              vus,
              checks_rate: value('checks', 'rate'),
              flow_error_rate: value('flow_errors', 'rate'),
              server_5xx_rate: value('server_5xx', 'rate'),
              rate_limited_rate: value('rate_limited', 'rate'),
              http_reqs: value('http_reqs', 'count'),
              http_p95_ms: value('http_req_duration', 'p(95)'),
              bank_p95_ms: value('bank_ms', 'p(95)'),
              create_p95_ms: value('create_ms', 'p(95)'),
              window_p95_ms: value('window_ms', 'p(95)'),
              submit_p95_ms: value('submit_ms', 'p(95)'),
              complete_p95_ms: value('complete_ms', 'p(95)'),
            })}`);
            return {};
          }
          EOF

      - name: Phase A - 10 concurrent students
        env:
          LOAD_VUS: 10
        run: |
          docker run --rm -e TARGET_URL="$TARGET_URL" -e LOAD_VUS="$LOAD_VUS" \
            -v "$PWD:/work:ro" -w /work grafana/k6:0.52.0 run /work/load-auth.js

      - name: Cooldown
        run: sleep 20

      - name: Phase B - 25 concurrent students
        env:
          LOAD_VUS: 25
        run: |
          docker run --rm -e TARGET_URL="$TARGET_URL" -e LOAD_VUS="$LOAD_VUS" \
            -v "$PWD:/work:ro" -w /work grafana/k6:0.52.0 run /work/load-auth.js

      - name: Cleanup isolated load users
        if: always()
        run: |
          cat > /tmp/cleanup-load-users.mjs <<'EOF'
          import { createClient } from '@supabase/supabase-js';
          const admin = createClient(process.env.SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, {
            auth: { autoRefreshToken: false, persistSession: false },
          });
          const { data, error } = await admin.auth.admin.listUsers({ page: 1, perPage: 1000 });
          if (error) throw error;
          const users = (data.users || []).filter((u) => /^royal-load-\d{3}@load\.invalid$/.test(u.email || ''));
          for (const user of users) {
            const deleted = await admin.auth.admin.deleteUser(user.id, false);
            if (deleted.error) throw deleted.error;
          }
          console.log(`Removed ${users.length} isolated load users and cascaded test data.`);
          EOF
          node /tmp/cleanup-load-users.mjs
