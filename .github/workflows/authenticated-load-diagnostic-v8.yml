# trigger: 2026-09-12 nhr8 bank cold-warm comparison
name: Authenticated Production Diagnostic V8

on:
  push:
    branches:
      - ops/authenticated-load-test
    paths:
      - .github/workflows/authenticated-load-diagnostic-v8.yml

permissions:
  contents: read

env:
  TARGET_URL: https://royal-bank-nhr8.vercel.app
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_p3T4sz4VpnWVuhjFgT1kwQ_b3mWaoO9
  LOAD_USER_COUNT: 75
  LOAD_AUTH_PACING_MS: 1200
  BANK_COLD_WARM_USERS: 75
  BANK_COLD_IDLE_MS: 60000
  BANK_WARM_GAP_MS: 1000

jobs:
  diagnose-75:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Prepare 75 isolated authenticated users
        run: node scripts/auth-load-prepare.mjs
      - name: Run 75-user first-vs-warm bank diagnostic
        run: node scripts/auth-bank-cold-warm.mjs
      - name: Cleanup isolated load users
        if: always()
        run: node scripts/auth-load-cleanup.mjs
