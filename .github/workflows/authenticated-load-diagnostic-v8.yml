name: Authenticated Production Diagnostic V8

on:
  push:
    branches:
      - ops/authenticated-load-test
    paths:
      - .github/workflows/authenticated-load-diagnostic-v8.yml

permissions:
  contents: read

env:
  TARGET_URL: https://royal-bank-21be.vercel.app
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_p3T4sz4VpnWVuhjFgT1kwQ_b3mWaoO9
  LOAD_USER_COUNT: 100
  LOAD_AUTH_PACING_MS: 1200

jobs:
  diagnose-100:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Prepare 100 isolated authenticated users
        run: node scripts/auth-load-prepare.mjs
      - name: Run 100-user middleware and direct exam-core diagnostic
        run: node scripts/auth-load-diagnostic.mjs
      - name: Cleanup isolated load users
        if: always()
        run: node scripts/auth-load-cleanup.mjs
